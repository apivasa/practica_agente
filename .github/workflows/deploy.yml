name: Despliegue

# V-05: aplica las migraciones a Supabase de producción y publica dist/ en
# GitHub Pages. Procedimiento, verificación y reversión en docs/despliegue.md.
#
# V-05b (ADR 0015 punto 5, fase 2): despliegue continuo en cada push a main
# (merge de un PR). El disparo manual sigue disponible y exige escribir
# `desplegar` en el input confirm. En los dos casos `verify` exige la rama
# main, los secretos, el origen de producción y el registro cerrado.
# Ningún job de este workflow lee SUPABASE_SECRET_KEY (H-S05-06) ni
# SUPABASE_ACCESS_TOKEN (H-V05-01): las migraciones van por --db-url al pooler
# de sesión con la contraseña de la BD (scripts/ci/db-url.sh).
#
# V-05c: en push, `verify` espera al CI (ci.yml) del mismo commit y exige
# success (scripts/ci/wait-ci.sh) antes de build, migraciones y Pages.
#
# Orden (ADR 0014): verify → build-pages → migrate-plan → migrate →
# deploy-pages → smoke. Lo barato y reversible (build, verificación de dist/)
# falla antes que lo irreversible (db push).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe exactamente "desplegar" para publicar en producción.'
        required: true
        default: ''
  # Los cambios solo de documentación (el candado y el latido de docs/estado.md
  # se suben a main a menudo) no cambian ni dist/ ni las migraciones.
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

# Un despliegue en curso nunca se cancela: un db push a medias es peor que
# esperar. Si llegan varios merges, GitHub deja en cola solo el más reciente.
concurrency:
  group: despliegue-produccion
  cancel-in-progress: false

jobs:
  verify:
    name: verificar configuración
    runs-on: ubuntu-latest
    # V-05c: incluye la espera al CI del commit (tope 20 min en wait-ci.sh).
    timeout-minutes: 25
    # H-C03-02: los secretos de producción se leen desde el environment
    # `produccion` (regla de ramas de despliegue = main).
    environment: produccion
    # actions: read solo para consultar el run de CI del mismo commit (V-05c).
    permissions:
      contents: read
      actions: read
    steps:
      # GITHUB_EVENT_NAME lo pone el runner. Solo `push` (a main, por el filtro
      # de on.push) se exime de confirm; cualquier otro evento lo exige.
      - name: Confirmación, rama y secretos
        env:
          CONFIRM: ${{ inputs.confirm }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_POOLER_HOST: ${{ vars.SUPABASE_DB_POOLER_HOST }}
        # Solo se comprueba si cada variable está vacía; nunca se imprime su valor.
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME:-}" = "push" ]; then
            echo "Despliegue continuo: push a main."
          elif [ "${CONFIRM}" != "desplegar" ]; then
            echo "::error::Despliegue no confirmado: el input confirm debe valer exactamente 'desplegar'."
            exit 1
          fi
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Solo se despliega desde main (ref actual: ${GITHUB_REF})."
            exit 1
          fi
          missing=()
          for name in SUPABASE_URL SUPABASE_PROJECT_REF SUPABASE_PUBLISHABLE_KEY SUPABASE_DB_PASSWORD; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Faltan secretos de producción: ${missing[*]}. Cárgalos en el environment 'produccion' o en los secretos del repositorio (P-02)."
            exit 1
          fi
          # Host del pooler de sesión (no es secreto): Supabase → Connect → Session pooler.
          if [ -z "${SUPABASE_DB_POOLER_HOST:-}" ]; then
            echo "::error::Falta la variable SUPABASE_DB_POOLER_HOST (host del pooler de sesión, p. ej. aws-0-us-east-1.pooler.supabase.com) en el environment 'produccion' o en las variables del repositorio."
            exit 1
          fi
          if ! [[ "${SUPABASE_DB_POOLER_HOST}" =~ ^aws-[0-9]+-[a-z]{2}-[a-z]+-[0-9]+\.pooler\.supabase\.com$ ]]; then
            echo "::error::SUPABASE_DB_POOLER_HOST no es un host de pooler de Supabase (aws-N-<región>.pooler.supabase.com)."
            exit 1
          fi
          case "${SUPABASE_PUBLISHABLE_KEY}" in
            sb_publishable_*) ;;
            *) echo "::error::SUPABASE_PUBLISHABLE_KEY no tiene el formato sb_publishable_ (no se usan claves legadas)."; exit 1 ;;
          esac
          case "${SUPABASE_URL}" in
            "https://${SUPABASE_PROJECT_REF}.supabase.co"|"https://${SUPABASE_PROJECT_REF}.supabase.co/") ;;
            *) echo "::error::SUPABASE_URL no corresponde a SUPABASE_PROJECT_REF."; exit 1 ;;
          esac
          echo "Configuración de producción completa."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # H-V05-QA-01: los secretos deben apuntar al mismo proyecto que fija la CSP
      # (src/security/csp.js, ADR 0011). Si apuntan a otro proyecto, se detiene
      # aquí, antes de migrar una base equivocada.
      - name: Origen de producción
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -euo pipefail
          expected="$(sed -nE "s/^export const PRODUCTION_SUPABASE_ORIGIN = '([^']+)';.*$/\1/p" src/security/csp.js)"
          if [ -z "$expected" ]; then
            echo "::error::No se encontró PRODUCTION_SUPABASE_ORIGIN en src/security/csp.js."
            exit 1
          fi
          if [ "${SUPABASE_URL%/}" != "$expected" ]; then
            echo "::error::SUPABASE_URL no es el origen de producción de src/security/csp.js ($expected)."
            exit 1
          fi
          echo "SUPABASE_URL coincide con el origen de producción ($expected)."
      # H-S05-01: db push no aplica supabase/config.toml. El registro debe estar
      # cerrado en el panel de Auth del proyecto real antes de migrar. Sin
      # `supabase config push` (ADR 0014 punto 3). La clave no se imprime.
      - name: Registro cerrado en Auth
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if ! settings="$(curl -fsS --max-time 20 "${SUPABASE_URL%/}/auth/v1/settings" -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}")"; then
            echo "::error::No se pudo leer /auth/v1/settings (¿proyecto pausado o clave publicable inválida?)."
            exit 1
          fi
          if [ "$(printf '%s' "$settings" | jq -r '.disable_signup')" != "true" ]; then
            echo "::error::El registro de usuarios está abierto en Supabase Auth: desactiva 'Allow new users to sign up' en el panel (docs/despliegue.md, requisitos previos)."
            exit 1
          fi
          echo "Registro de usuarios cerrado (disable_signup = true)."
      # V-05c (H-ARQ-V05b-01, H-V05b-01, H-V05b-02): en push a main, espera a
      # que el CI (ci.yml) del mismo SHA termine y exige success antes de
      # build, migraciones y Pages. Con disparo manual no espera (lo decide
      # quien confirma). Sin if: por evento: lo decide el script.
      - name: CI del mismo commit en verde
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/ci/wait-ci.sh

  build-pages:
    name: build del front
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: produccion
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # H-004: sin scripts de ciclo de vida; solo esbuild se reconstruye.
      - name: Instalar dependencias
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild
      # Solo la URL y la clave publicable llegan al build: nunca la secreta.
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      # ADR 0011: la CSP publicada no debe llevar orígenes loopback y sí
      # upgrade-insecure-requests; dist/ nunca contiene una clave secreta.
      - name: Verificar dist/
        run: |
          set -euo pipefail
          csp="$(grep -o '<meta http-equiv="Content-Security-Policy" content="[^"]*"' dist/index.html || true)"
          if [ -z "$csp" ]; then
            echo "::error::dist/index.html no tiene la meta CSP."
            exit 1
          fi
          echo "$csp"
          if printf '%s' "$csp" | grep -Eq '127\.0\.0\.1|localhost'; then
            echo "::error::La CSP de dist/ contiene un origen local."
            exit 1
          fi
          if ! printf '%s' "$csp" | grep -q 'upgrade-insecure-requests'; then
            echo "::error::La CSP de dist/ no incluye upgrade-insecure-requests."
            exit 1
          fi
          # supabase-js contiene el literal "sb_secret_" (detecta el formato de clave):
          # se busca una clave real, es decir, el prefijo seguido de su cuerpo.
          if grep -rEq 'sb_secret_[A-Za-z0-9_-]{16,}' dist; then
            echo "::error::dist/ contiene una clave secreta (sb_secret_)."
            exit 1
          fi
          if grep -rEq '(127\.0\.0\.1|localhost):54321' dist; then
            echo "::error::dist/ apunta a Supabase local."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  # Plan de migraciones en un job propio. Si el environment `produccion` tiene
  # revisor requerido, `migrate` espera su aprobación después de este job, con
  # el dry-run ya en el log: esa aprobación es la parada real antes de db push.
  migrate-plan:
    name: plan de migraciones (dry-run)
    needs: build-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: produccion
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.2.0
      # H-V05-01: sin `supabase link` ni token de cuenta. Cada paso construye
      # la cadena del pooler (scripts/ci/db-url.sh, enmascarada, nunca impresa)
      # y la pasa con --db-url: destino remoto explícito, nunca el stack local.
      # H-F03-07: nunca la opción de incluir la semilla. Sin --debug: podría
      # volcar la cadena de conexión.
      - name: Migraciones pendientes (dry-run)
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_POOLER_HOST: ${{ vars.SUPABASE_DB_POOLER_HOST }}
        run: |
          set -euo pipefail
          . scripts/ci/db-url.sh
          supabase_db_url
          echo "Migraciones en el repositorio:"
          ls -1 supabase/migrations
          echo "Migraciones que se aplicarán:"
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

  migrate:
    name: migraciones (Supabase)
    needs: migrate-plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: produccion
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.2.0
      # H-F03-07: nunca la opción de incluir la semilla (seed.sql tiene cuentas locales con
      # contraseña común). Sin --debug: podría volcar la cadena de conexión.
      # Se repite el dry-run justo antes de aplicar: la aprobación del revisor
      # puede llegar tiempo después de migrate-plan.
      - name: Migraciones pendientes (dry-run)
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_POOLER_HOST: ${{ vars.SUPABASE_DB_POOLER_HOST }}
        run: |
          set -euo pipefail
          . scripts/ci/db-url.sh
          supabase_db_url
          echo "Migraciones que se aplicarán:"
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
      - name: Aplicar migraciones
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_POOLER_HOST: ${{ vars.SUPABASE_DB_POOLER_HOST }}
        run: |
          set -euo pipefail
          . scripts/ci/db-url.sh
          supabase_db_url
          supabase db push --db-url "$SUPABASE_DB_URL" --yes
      # Evidencia en el log de las migraciones aplicadas (criterio de V-05).
      - name: Migraciones aplicadas
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_POOLER_HOST: ${{ vars.SUPABASE_DB_POOLER_HOST }}
        run: |
          set -euo pipefail
          . scripts/ci/db-url.sh
          supabase_db_url
          supabase migration list --db-url "$SUPABASE_DB_URL"

  deploy-pages:
    name: publicar en Pages
    needs: [build-pages, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke:
    name: prueba de humo
    needs: deploy-pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: GET de la URL publicada
        env:
          PAGE_URL: ${{ needs.deploy-pages.outputs.page_url }}
        run: |
          set -euo pipefail
          url="${PAGE_URL:-https://apivasa.github.io/practica_agente/}"
          origin="$(printf '%s' "$url" | grep -oE '^https://[^/]+' || true)"
          for attempt in 1 2 3 4 5 6; do
            code="$(curl -sS -o page.html -w '%{http_code}' "$url" || echo 000)"
            if [ "$code" = "200" ] && grep -q '<title>App de control de capacidad RUN</title>' page.html; then
              # Si la base de Vite se rompe, el HTML da 200 pero los assets 404.
              js="$(grep -oE 'src="/practica_agente/assets/[^"]+\.js"' page.html | head -n 1 | sed -E 's/^src="//; s/"$//' || true)"
              if [ -n "$js" ]; then
                js_code="$(curl -sS -o /dev/null -w '%{http_code}' "${origin}${js}" || echo 000)"
                if [ "$js_code" = "200" ]; then
                  echo "Publicado: $url (HTTP 200, título correcto, JS principal $js con HTTP 200)."
                  exit 0
                fi
                echo "Intento $attempt: JS principal $js con HTTP $js_code."
              else
                echo "Intento $attempt: page.html no referencia el JS principal en /practica_agente/assets/."
              fi
            else
              echo "Intento $attempt: HTTP $code."
            fi
            echo "Reintento en 20 s."
            sleep 20
          done
          echo "::error::$url no respondió 200 con el título de la app y su JS principal."
          exit 1
