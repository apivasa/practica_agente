name: Seguridad

# Pipeline de seguridad (S-01): secretos, SAST, dependencias, CodeQL y pruebas
# de seguridad propias. Corre en cada PR, en push a main y a ramas de trabajo
# (validación antes del PR, igual que ci.yml), y una vez por semana.
# S-05 añade el pentest previo a producción: fase A (local, en cada ejecución)
# y fase B (manual con fase_b != no, contra producción, no destructiva).
on:
  pull_request:
  push:
    branches: [main, 'item/**', 'fix/**', 'ensayo/**']
  schedule:
    - cron: '17 6 * * 1' # lunes 06:17 UTC
  workflow_dispatch:
    inputs:
      fase_b:
        # S-05 fase B: solo tras el primer despliegue (V-05) y desde main.
        description: 'S-05 fase B contra producción (Pages + Supabase real): no | anonimo | roles'
        required: false
        default: 'no'
        type: choice
        options: ['no', 'anonimo', 'roles']

permissions:
  contents: read

concurrency:
  group: seguridad-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 de gitleaks_8.30.1_linux_x64.tar.gz (gitleaks_8.30.1_checksums.txt).
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  SEMGREP_VERSION: 1.185.0

jobs:
  gitleaks:
    name: gitleaks (historial completo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Descargar gitleaks y verificar checksum
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "/tmp/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  /tmp/${tarball}" | sha256sum -c -
          mkdir -p /tmp/gitleaks
          tar -xzf "/tmp/${tarball}" -C /tmp/gitleaks gitleaks
      # Historial completo de la rama analizada (HEAD). Sin --log-opts gitleaks
      # usa `git log --all` y, como fetch-depth: 0 trae todas las ramas remotas,
      # un secreto en cualquier rama haría fallar a todas las demás.
      - name: Escanear todo el historial de la rama
        run: |
          /tmp/gitleaks/gitleaks git --redact --verbose --exit-code 1 \
            --log-opts="--full-history HEAD" \
            --report-format sarif --report-path gitleaks.sarif .
      - name: Guardar informe
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 14

  semgrep:
    name: semgrep (JS, secretos, Actions, SQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Instalar semgrep
        run: python -m pip install --disable-pip-version-check "semgrep==${SEMGREP_VERSION}"
      - name: Escanear
        run: |
          semgrep scan --metrics=off --error \
            --config p/javascript \
            --config p/secrets \
            --config p/github-actions \
            --config p/sql-injection \
            --exclude node_modules --exclude dist

  npm-audit:
    name: npm audit (producción)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Instalar sin scripts
        run: npm ci --ignore-scripts
      - name: Auditar dependencias de producción
        run: npm audit --omit=dev --audit-level=high
      - name: Verificar firmas del registro
        run: npm audit signatures

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  security-tests:
    name: pruebas de seguridad (tests/security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Instalar sin scripts
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild
      - name: Build (para escanear dist/)
        run: npm run build
      - name: Pruebas de seguridad
        env:
          SECURITY_REQUIRE_DIST: '1'
        run: node --test 'tests/security/*.test.js'

  # S-03: pentest de la API real (PostgREST + Auth) contra Supabase local con
  # seed. Matriz rol × tabla × operación, IDOR, escalada, JWT manipulado,
  # upsert indebido y esquemas no expuestos. Cualquier tabla sin RLS o sin fila
  # en la matriz hace fallar el job.
  pentest-api:
    name: pentest API (PostgREST/Auth, Supabase local)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          # Misma versión fija que ci.yml (H-002).
          version: 3.2.0
      - name: Levantar Supabase local (migraciones + seed)
        # Reintento acotado ante puerto ocupado; falla con código ≠ 0 al agotarlo (F-07).
        run: bash scripts/ci/supabase-start.sh supabase start -x studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector
      # Las claves locales las genera la CLI para este runner efímero. Se pasan
      # por un archivo (no por GITHUB_ENV) para que no aparezcan en la cabecera
      # de env de los pasos siguientes; solo se imprimen los nombres.
      - name: Obtener URL y claves locales
        run: |
          set -euo pipefail
          supabase status -o env > /tmp/sb.env
          cut -d= -f1 /tmp/sb.env
          get() { grep -E "^$1=" /tmp/sb.env | head -n1 | cut -d= -f2- | tr -d '"'; }
          umask 077
          {
            echo "PENTEST_API_URL=$(get API_URL)"
            echo "PENTEST_PUBLISHABLE_KEY=$(get PUBLISHABLE_KEY)"
            echo "PENTEST_SECRET_KEY=$(get SECRET_KEY)"
            echo "PENTEST_JWT_SECRET=$(get JWT_SECRET)"
            echo "PENTEST_DB_URL=$(get DB_URL)"
          } > /tmp/pentest.env
          rm -f /tmp/sb.env
      - name: Pentest de la API
        env:
          PENTEST_REQUIRE: '1'
        run: |
          set -euo pipefail
          set -a; . /tmp/pentest.env; set +a
          # F-09: una sola ronda de inicios de sesión para todos los archivos;
          # los tokens viajan por entorno (nunca a disco ni al log).
          PENTEST_TOKENS="$(node tests/security/api/login-all.mjs)"
          export PENTEST_TOKENS
          node --test --test-concurrency=1 'tests/security/api/*.test.js'
      - name: Detener Supabase
        if: always()
        run: supabase stop --no-backup

  # S-04: DAST. Build del front conectado a Supabase local, pruebas e2e de
  # seguridad (XSS, CSP, anti-framing) y OWASP ZAP baseline (pasivo, sin
  # ataques activos) contra dist/ servido bajo /practica_agente/. Solo apunta a
  # 127.0.0.1 del runner. Falla con cualquier alerta de riesgo alto o con una
  # regla marcada FAIL en .zap/rules.tsv.
  dast:
    name: DAST (e2e de seguridad + ZAP baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Imagen fijada por digest (zap-stable, publicada al 2026-11-19). Se
      # actualiza en un PR revisado: versión y digest juntos.
      ZAP_IMAGE: zaproxy/zap-stable@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Instalar sin scripts
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild
      - run: npx playwright install --with-deps chromium
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.2.0
      - name: Levantar Supabase local (migraciones + seed)
        # Reintento acotado ante puerto ocupado; falla con código ≠ 0 al agotarlo (F-07).
        run: bash scripts/ci/supabase-start.sh supabase start -x studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector
      - name: Exportar URL y clave publicable para el build
        # Solo la clave publicable llega al front; nunca la secreta.
        run: |
          set -euo pipefail
          supabase status -o env > "$RUNNER_TEMP/sb.env"
          get() { grep -E "^$1=" "$RUNNER_TEMP/sb.env" | head -n1 | cut -d= -f2- | tr -d '"'; }
          url="$(get API_URL)"
          key="$(get PUBLISHABLE_KEY)"
          rm -f "$RUNNER_TEMP/sb.env"
          case "$key" in
            sb_publishable_*) ;;
            *) echo "::error::supabase status no expone una clave sb_publishable_"; exit 1 ;;
          esac
          [ -n "$url" ] || { echo "::error::supabase status no expone API_URL"; exit 1; }
          echo "VITE_SUPABASE_URL=$url" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$key" >> "$GITHUB_ENV"
      - name: Evaluar la semilla (evaluaciones y alertas para el pentest de V-01..V-03)
        # Mismo script que ci.yml: solo Supabase local; la clave secreta local queda
        # dentro del script (enmascarada) y no pasa a GITHUB_ENV ni al build.
        run: bash scripts/ci/seed-evaluations.sh
      - name: Build conectado a Supabase local
        run: npm run build
      - name: La CSP del build admite Supabase local y nada más
        run: |
          set -euo pipefail
          grep -o '<meta http-equiv="Content-Security-Policy"[^>]*>' dist/index.html
          grep -q 'http://127.0.0.1:54321' dist/index.html
          ! grep -Eq "unsafe-inline|unsafe-eval" dist/index.html
      - name: Pruebas e2e de seguridad (XSS, CSP, anti-framing, CSV)
        run: npx playwright test e2e/security
      - name: Servir dist/ bajo /practica_agente/
        run: |
          set -euo pipefail
          nohup npx vite preview --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/practica_agente/ > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/preview.log"; exit 1
      - name: OWASP ZAP baseline
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zap"
          cp .zap/rules.tsv "$RUNNER_TEMP/zap/rules.tsv"
          chmod -R 777 "$RUNNER_TEMP/zap"
          docker pull -q "$ZAP_IMAGE"
          docker image inspect --format 'Imagen ZAP: {{index .RepoDigests 0}}' "$ZAP_IMAGE"
          # -I: las advertencias no hacen fallar; las reglas FAIL y el riesgo alto sí (paso siguiente).
          status=0
          docker run --rm --network host -v "$RUNNER_TEMP/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t http://127.0.0.1:4173/practica_agente/ \
            -c rules.tsv -J zap-report.json -r zap-report.html -I || status=$?
          echo "zap-baseline.py terminó con código ${status}"
          # 0 = sin FAIL; 1 = al menos una regla FAIL; 2 = solo WARN (no se da con -I); 3 = error de ZAP.
          [ "$status" -eq 0 ]
      - name: Sin alertas de riesgo alto
        if: always()
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/zap/zap-report.json"
          [ -f "$report" ] || { echo "::error::ZAP no generó informe"; exit 1; }
          jq -r '.site[].alerts[] | "\(.riskdesc)\t\(.pluginid)\t\(.alert)\t\(.count)"' "$report" | sort -r
          urls=$(jq '[.site[].alerts[].instances[]?.uri] | unique | length' "$report")
          echo "URL con alertas: ${urls}"
          high=$(jq '[.site[].alerts[] | select((.riskcode | tonumber) >= 3)] | length' "$report")
          [ "$high" -eq 0 ] || { echo "::error::ZAP reporta ${high} alertas de riesgo alto"; exit 1; }
      - name: Guardar informes de ZAP
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-baseline
          path: |
            ${{ runner.temp }}/zap/zap-report.json
            ${{ runner.temp }}/zap/zap-report.html
          if-no-files-found: ignore
          retention-days: 14
      - name: Detener Supabase
        if: always()
        run: supabase stop --no-backup

  # S-05 fase A: pentest previo a producción contra un build de PRODUCCIÓN
  # (vite build + vite preview) conectado a Supabase local con las migraciones de
  # la rama y la semilla. Dos escaneos ZAP activos, solo contra 127.0.0.1 del
  # runner: full scan del front (con AJAX spider) y API scan de PostgREST con la
  # sesión de la gestora (la de más superficie de escritura). El pentest por rol
  # de la API (tests/security/api/preprod-s05.test.js) corre en pentest-api.
  s05-fase-a:
    name: S-05 fase A (ZAP full scan + API scan, local)
    # Pesado (~10 min): en PR (todos van a main), semanal y manual; no en cada push.
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.fase_b == 'no')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ZAP_IMAGE: zaproxy/zap-stable@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Instalar sin scripts
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.2.0
      - name: Levantar Supabase local (migraciones + seed)
        # Reintento acotado ante puerto ocupado; falla con código ≠ 0 al agotarlo (F-07).
        run: bash scripts/ci/supabase-start.sh supabase start -x studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector
      - name: Exportar URL y clave publicable para el build
        run: |
          set -euo pipefail
          supabase status -o env > "$RUNNER_TEMP/sb.env"
          get() { grep -E "^$1=" "$RUNNER_TEMP/sb.env" | head -n1 | cut -d= -f2- | tr -d '"'; }
          url="$(get API_URL)"
          key="$(get PUBLISHABLE_KEY)"
          rm -f "$RUNNER_TEMP/sb.env"
          case "$key" in sb_publishable_*) ;; *) echo "::error::sin clave sb_publishable_"; exit 1 ;; esac
          case "$url" in http://127.0.0.1:*) ;; *) echo "::error::la fase A solo corre contra Supabase local"; exit 1 ;; esac
          echo "VITE_SUPABASE_URL=$url" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$key" >> "$GITHUB_ENV"
      - name: Evaluar la semilla (candados y alertas reales en la BD)
        run: bash scripts/ci/seed-evaluations.sh
      - name: Build de producción y servidor de vista previa
        run: |
          set -euo pipefail
          npm run build
          nohup npx vite preview --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/practica_agente/ > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/preview.log"; exit 1
      - name: Preparar ZAP
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zap"
          cp .zap/rules.tsv "$RUNNER_TEMP/zap/rules.tsv"
          chmod -R 777 "$RUNNER_TEMP/zap"
          docker pull -q "$ZAP_IMAGE"
          docker image inspect --format 'Imagen ZAP: {{index .RepoDigests 0}}' "$ZAP_IMAGE"
      - name: ZAP full scan del front (activo, local)
        run: |
          set -euo pipefail
          status=0
          docker run --rm --network host -v "$RUNNER_TEMP/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-full-scan.py -t http://127.0.0.1:4173/practica_agente/ -j -m 2 \
            -c rules.tsv -J front-full.json -r front-full.html -I \
            -z "-config globalexcludeurl.url_list.url(0).regex=^https?://(?!127\.0\.0\.1:4173/practica_agente/).*$ -config globalexcludeurl.url_list.url(0).description=fuera-de-alcance -config globalexcludeurl.url_list.url(0).enabled=true -config scanner.maxScanDurationInMins=15 -config scanner.maxRuleDurationInMins=3" || status=$?
          echo "zap-full-scan.py terminó con código ${status}"
          [ "$status" -eq 0 ]
      # OpenAPI de PostgREST con todas las tablas (clave secreta LOCAL, solo en
      # este paso) reescrito para apuntar al gateway local. Los filtros de fila
      # llevan por defecto `not.is.null` (sin operador PostgREST responde 400 y
      # ZAP no llegaría a la consulta) y se quitan los DELETE (borrarían la
      # semilla a mitad del escaneo; el borrado ya lo cubre la matriz de S-03). La sesión de la
      # gestora (seed, contraseña local pública) llega a ZAP por --env-file
      # (ZAP_AUTH_HEADER_VALUE), no por la línea de comandos.
      - name: Especificación OpenAPI y sesión de la gestora (locales)
        run: |
          set -euo pipefail
          supabase status -o env > "$RUNNER_TEMP/sb.env"
          get() { grep -E "^$1=" "$RUNNER_TEMP/sb.env" | head -n1 | cut -d= -f2- | tr -d '"'; }
          secret="$(get SECRET_KEY)"
          rm -f "$RUNNER_TEMP/sb.env"
          # Clave y sesión locales y efímeras: nunca se imprimen (sin echo ni set -x).
          curl -sSf -H "apikey: ${secret}" -H 'Accept: application/openapi+json' \
            "${VITE_SUPABASE_URL}/rest/v1/" \
            | jq '.host = "127.0.0.1:54321" | .basePath = "/rest/v1" | .schemes = ["http"]
                | .parameters |= with_entries(
                    if (.key | startswith("rowFilter.")) then .value.default = "not.is.null" | .value.enum = ["not.is.null"]
                    elif .key == "select" then .value.default = "*" | .value.enum = ["*"]
                    else . end)
                | .paths |= map_values(del(.delete)
                    | map_values(if type == "object" and has("parameters") then
                        .parameters |= map(select((."$ref" // "") | test("/(rowFilter\\.|select$|body\\.)")))
                      else . end))' \
            > "$RUNNER_TEMP/zap/openapi.json"
          chmod 644 "$RUNNER_TEMP/zap/openapi.json"
          jq -r '.paths | keys[]' "$RUNNER_TEMP/zap/openapi.json"
          token="$(curl -sSf -H "apikey: ${VITE_SUPABASE_PUBLISHABLE_KEY}" -H 'Content-Type: application/json' \
            -d '{"email":"gestora@example.test","password":"Local-Only-Pass-2026"}' \
            "${VITE_SUPABASE_URL}/auth/v1/token?grant_type=password" | jq -r .access_token)"
          if [ -z "$token" ] || [ "$token" = null ]; then echo "::error::login de la gestora local falló"; exit 1; fi
          # Cobertura (QA-S05-02): la lectura base que ZAP toma de la especificación
          # debe responder 200 para que sus ataques lleguen a la consulta.
          base_ok=0
          for p in $(jq -r '.paths | keys[] | select(. != "/")' "$RUNNER_TEMP/zap/openapi.json"); do
            q="$(jq -r --arg p "$p" '.parameters as $P
              | [.paths[$p].get.parameters[]?."$ref" | sub("#/parameters/"; "") | $P[.]
                 | select(.in == "query") | "\(.name)=\(.default // "")"] | join("&")' "$RUNNER_TEMP/zap/openapi.json")"
            code="$(curl -s -o "$RUNNER_TEMP/base.out" -w '%{http_code}' -H "apikey: ${VITE_SUPABASE_PUBLISHABLE_KEY}" \
              -H "Authorization: Bearer ${token}" "${VITE_SUPABASE_URL}/rest/v1${p}?${q}")"
            echo "lectura base ${p}: ${code} $(head -c 200 "$RUNNER_TEMP/base.out")"
            if [ "$code" = 200 ]; then base_ok=$((base_ok + 1)); fi
          done
          rm -f "$RUNNER_TEMP/base.out"
          echo "Lecturas base con 200: ${base_ok}"
          umask 077
          printf 'ZAP_AUTH_HEADER_VALUE=Bearer %s\nZAP_AUTH_HEADER=Authorization\nZAP_AUTH_HEADER_SITE=127.0.0.1\n' "$token" > "$RUNNER_TEMP/zap-auth.env"
      - name: ZAP API scan de PostgREST (activo, local, sesión de gestora)
        run: |
          set -euo pipefail
          # awk en vez de grep: sin coincidencias no corta el paso (pipefail) y
          # el ::error:: propio llega al log (QA-S05-04).
          kong="$(docker ps --format '{{.Names}}' | awk '/^supabase_kong_/ {print; exit}')"
          [ -n "$kong" ] || { echo "::error::no se encontró el contenedor Kong de Supabase local"; exit 1; }
          before="$(docker logs "$kong" 2>&1 | wc -l)"
          status=0
          docker run --rm --network host --env-file "$RUNNER_TEMP/zap-auth.env" \
            -v "$RUNNER_TEMP/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-api-scan.py -t /zap/wrk/openapi.json -f openapi \
            -J api-scan.json -r api-scan.html -I \
            -z "-config replacer.full_list(0).description=apikey -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=apikey -config replacer.full_list(0).regex=false -config replacer.full_list(0).replacement=${VITE_SUPABASE_PUBLISHABLE_KEY} -config scanner.maxScanDurationInMins=20 -config scanner.maxRuleDurationInMins=3" || status=$?
          rm -f "$RUNNER_TEMP/zap-auth.env"
          echo "zap-api-scan.py terminó con código ${status}"
          # El escaneo solo vale si ZAP llegó autenticado: códigos de estado que
          # el gateway local registró para /rest/v1 durante el escaneo.
          docker logs "$kong" > "$RUNNER_TEMP/kong.log" 2>&1
          tail -n +"$((before + 1))" "$RUNNER_TEMP/kong.log" \
            | awk 'match($0, /"(GET|POST|PATCH|PUT|DELETE|HEAD|OPTIONS) \/rest\/v1\/[^"]*" [0-9][0-9][0-9]/) {
                s = substr($0, RSTART, RLENGTH); n = split(s, a, " "); m = a[1]; gsub(/"/, "", m); print m, a[n] }' \
            | sort | uniq -c | sort -rn > "$RUNNER_TEMP/zap/api-status.txt"
          rm -f "$RUNNER_TEMP/kong.log"
          cat "$RUNNER_TEMP/zap/api-status.txt"
          # Sin sesión válida todo sería 401 (anon no tiene privilegios). Con la
          # sesión de la gestora: 200 en las lecturas base, 403 en las tablas que
          # no puede escribir y 400 cuando el parser estricto de PostgREST rechaza
          # el payload (los payloads genéricos de ZAP no llevan operador).
          total="$(awk '{n += $1} END {print n + 0}' "$RUNNER_TEMP/zap/api-status.txt")"
          unauth="$(awk '$3 == "401" {n += $1} END {print n + 0}' "$RUNNER_TEMP/zap/api-status.txt")"
          ok="$(awk '$3 ~ /^2/ {n += $1} END {print n + 0}' "$RUNNER_TEMP/zap/api-status.txt")"
          srv="$(awk '$3 ~ /^5/ {n += $1} END {print n + 0}' "$RUNNER_TEMP/zap/api-status.txt")"
          echo "Peticiones a PostgREST: ${total} · 2xx: ${ok} · 401: ${unauth} · 5xx: ${srv}"
          [ "$total" -ge 1000 ] || { echo "::error::ZAP apenas atacó la API (${total} peticiones)"; exit 1; }
          [ "$unauth" -eq 0 ] && [ "$ok" -ge 1 ] || { echo "::error::ZAP no llegó autenticado a PostgREST"; exit 1; }
          [ "$srv" -eq 0 ] || { echo "::error::PostgREST respondió ${srv} errores 5xx a payloads de ZAP"; exit 1; }
          [ "$status" -eq 0 ]
      - name: Sin alertas de riesgo alto (front y API)
        if: always()
        run: |
          set -euo pipefail
          fail=0
          for name in front-full api-scan; do
            report="$RUNNER_TEMP/zap/${name}.json"
            if [ ! -f "$report" ]; then echo "::error::ZAP no generó ${name}.json"; fail=1; continue; fi
            echo "== ${name}"
            jq -r '.site[].alerts[] | "\(.riskdesc)\t\(.pluginid)\t\(.alert)\t\(.count)"' "$report" | sort -r
            echo "-- instancias de riesgo medio o superior (método, URI, evidencia)"
            jq -r '.site[].alerts[] | select((.riskcode | tonumber) >= 2) | .pluginid as $p
              | .instances[:4][] | "\($p)\t\(.method)\t\(.uri[:160])\t\((.evidence // "")[:120])"' "$report"
            high=$(jq '[.site[].alerts[] | select((.riskcode | tonumber) >= 3)] | length' "$report")
            [ "$high" -eq 0 ] || { echo "::error::${name}: ${high} alertas de riesgo alto"; fail=1; }
          done
          # La exclusión global de ZAP mantiene el full scan del front en su subárbol
          # (mismo mecanismo que la fase B usa contra Pages: QA-S05-03).
          front="$RUNNER_TEMP/zap/front-full.json"
          if [ -f "$front" ]; then
            out=$(jq -r '[.site[].alerts[].instances[]?.uri | select(startswith("http://127.0.0.1:4173/practica_agente/") | not)] | unique | .[]' "$front")
            [ -z "$out" ] || { echo "::error::el full scan del front salió de su subárbol: ${out}"; fail=1; }
          fi
          [ "$fail" -eq 0 ]
      - name: Guardar informes de ZAP
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s05-fase-a-zap
          path: |
            ${{ runner.temp }}/zap/front-full.json
            ${{ runner.temp }}/zap/front-full.html
            ${{ runner.temp }}/zap/api-scan.json
            ${{ runner.temp }}/zap/api-scan.html
          if-no-files-found: ignore
          retention-days: 30
      - name: Detener Supabase
        if: always()
        run: supabase stop --no-backup

  # S-05 fase B: contra PRODUCCIÓN (Pages del repo y el proyecto Supabase del
  # repo). Solo a mano, tras el primer despliegue y desde main (environment
  # produccion). No destructiva: sin clave secreta (la URL y la clave publicable
  # se sacan del front publicado), lecturas y sondas que la BD debe rechazar,
  # ZAP full scan con 1 hilo, retardo y duración acotada, sin AJAX spider ni
  # escaneo activo de la API de producción.
  s05-fase-b:
    name: S-05 fase B (producción, no destructiva)
    if: github.event_name == 'workflow_dispatch' && inputs.fase_b != 'no' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: produccion
    permissions:
      contents: read
    env:
      ZAP_IMAGE: zaproxy/zap-stable@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
      S05_PAGES_URL: https://apivasa.github.io/practica_agente/
      S05_PROJECT_REF: oehtspdtpwdhfhhhkgao
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Segunda barrera (la primera es el if del job): todo paso que contacta
      # producción exige que esta guarda haya pasado (QA-S05-01).
      - name: Solo desde main
        id: main-guard
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then echo "::error::la fase B solo corre desde main (${GITHUB_REF})"; exit 1; fi
      - name: Configuración del repositorio (informativo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          env_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/produccion" 2>/dev/null)"
          policy="$(printf '%s' "${env_json:-null}" | jq -c '.deployment_branch_policy // null' 2>/dev/null)"
          echo "environment produccion · deployment_branch_policy: ${policy:-desconocido}"
          if [ "${policy:-null}" = "null" ]; then echo "::warning::environment produccion sin regla de ramas (H-C03-02)"; fi
          gh api "repos/${GITHUB_REPOSITORY}" --jq '.security_and_analysis' 2>/dev/null
          exit 0
      - name: Pentest no destructivo (front publicado, Auth y API)
        env:
          S05_REQUIRE: '1'
          S05_MODE: ${{ inputs.fase_b }}
          S05_TEST_USERS: ${{ secrets.S05_TEST_USERS }}
        run: node --test tests/security/prod/fase-b.test.js
      - name: ZAP full scan de Pages (1 hilo, con retardo, duración acotada)
        # Corre aunque falle el pentest (son pruebas independientes), pero nunca
        # si falló la guarda de main.
        if: ${{ !cancelled() && steps.main-guard.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zap"
          cp .zap/rules.tsv "$RUNNER_TEMP/zap/rules.tsv"
          chmod -R 777 "$RUNNER_TEMP/zap"
          docker pull -q "$ZAP_IMAGE"
          status=0
          docker run --rm -v "$RUNNER_TEMP/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-full-scan.py -t https://apivasa.github.io/practica_agente/ -m 1 \
            -c rules.tsv -J pages-full.json -r pages-full.html -I \
            -z "-config globalexcludeurl.url_list.url(0).regex=^https?://(?!apivasa\.github\.io/practica_agente/).*$ -config globalexcludeurl.url_list.url(0).description=fuera-de-alcance -config globalexcludeurl.url_list.url(0).enabled=true -config scanner.threadPerHost=1 -config scanner.delayInMs=300 -config scanner.maxScanDurationInMins=15 -config scanner.maxRuleDurationInMins=2" || status=$?
          echo "zap-full-scan.py terminó con código ${status}"
          [ "$status" -eq 0 ]
      - name: Sin alertas de riesgo alto (Pages)
        if: ${{ !cancelled() && steps.main-guard.outcome == 'success' }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/zap/pages-full.json"
          [ -f "$report" ] || { echo "::error::ZAP no generó informe"; exit 1; }
          jq -r '.site[].alerts[] | "\(.riskdesc)\t\(.pluginid)\t\(.alert)\t\(.count)"' "$report" | sort -r
          high=$(jq '[.site[].alerts[] | select((.riskcode | tonumber) >= 3)] | length' "$report")
          [ "$high" -eq 0 ] || { echo "::error::ZAP reporta ${high} alertas de riesgo alto en Pages"; exit 1; }
          out=$(jq -r '[.site[].alerts[].instances[]?.uri | select(startswith("https://apivasa.github.io/practica_agente/") | not)] | unique | .[]' "$report")
          [ -z "$out" ] || { echo "::error::ZAP salió del alcance (/practica_agente/): ${out}"; exit 1; }
      - name: Guardar informes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s05-fase-b-zap
          path: |
            ${{ runner.temp }}/zap/pages-full.json
            ${{ runner.temp }}/zap/pages-full.html
          if-no-files-found: ignore
          retention-days: 90
