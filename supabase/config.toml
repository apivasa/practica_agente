# Configuración mínima de Supabase CLI. La CLI aplica valores por defecto al resto.
project_id = "practica-agente"

[auth]
# H-F03-06: sin registro abierto. Las cuentas las crea la gestora (o el seed
# en local); un usuario autenticado sin fila en user_roles no ve nada.
enable_signup = false
# H-S03-02: contraseña mínima de 12 con minúsculas, mayúsculas y dígitos. Esto
# rige en local y CI; en producción se fija igual en el panel de Auth
# (config.toml no se aplica con db push, ADR 0015 punto 3).
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"
# H-S03-00: no se declara [auth.email].enable_signup. En la CLI de Supabase 3.x
# esa clave desactiva el proveedor de correo entero (422 email_provider_disabled)
# y nadie puede iniciar sesión. El registro queda cerrado por [auth].enable_signup.
