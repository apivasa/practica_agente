name: CI

on:
  pull_request:
  push:
    # main + ramas de trabajo del modo autónomo (validación antes del PR).
    branches: [main, 'item/**', 'fix/**']
  # Permite lanzarlo a mano o desde lockfile.yml: los commits hechos con
  # GITHUB_TOKEN no disparan otros workflows por push/pull_request.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Acciones fijadas por SHA de commit (H-001); Dependabot propone las subidas.
# Instalación con --ignore-scripts (H-004): solo esbuild se reconstruye a mano.
jobs:
  build:
    name: build (lint, unit, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Instalar dependencias
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts; fi
          npm rebuild esbuild
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  db:
    name: db (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          # Versión fija de la CLI (H-002); se actualiza por PR revisado.
          version: 3.2.0
      - name: Levantar Postgres local
        run: supabase db start
      - name: Pruebas pgTAP
        run: supabase test db
      - name: Detener Supabase
        if: always()
        run: supabase stop --no-backup

  e2e:
    name: e2e (Playwright)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Instalar dependencias
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts; fi
          npm rebuild esbuild
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
