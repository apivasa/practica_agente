name: Ritmo diario

# C-03/C-04: cada día revisa el ritmo de vulnerabilidades, el ingreso de P0/P1 y el
# vencimiento de excepciones, y genera las alertas.
# 11:23 UTC = 06:23 America/Guayaquil (UTC-5 todo el año).
on:
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:
    inputs:
      as_of:
        description: 'Fecha de evaluación YYYY-MM-DD (vacío = hoy en America/Guayaquil).'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: evaluacion-produccion
  cancel-in-progress: false

jobs:
  evaluate:
    name: evaluar (diario)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # H-C03-02: la clave secreta se lee del environment `produccion` (regla de
    # ramas de despliegue = main), no de los secretos del repositorio.
    environment: produccion
    steps:
      # Producción solo si existen los secretos y la variable EVALUATION_ENABLED = 'true'
      # (se activa tras el primer despliegue, V-05: compuerta del usuario).
      - name: Verificar configuración
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          EVALUATION_ENABLED: ${{ vars.EVALUATION_ENABLED }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::warning::Faltan los secretos SUPABASE_URL o SUPABASE_SECRET_KEY: se omite la evaluación."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVALUATION_ENABLED" != "true" ]; then
            echo "::warning::La variable de repositorio EVALUATION_ENABLED no es 'true' (producción aún no publicada, V-05): se omite la evaluación."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
      - name: Instalar dependencias de producción
        if: steps.check.outputs.ready == 'true'
        run: npm ci --ignore-scripts --omit=dev
      - name: Evaluar
        if: steps.check.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          AS_OF: ${{ inputs.as_of }}
        run: node scripts/evaluate.js --mode=daily --as-of="${AS_OF}"
