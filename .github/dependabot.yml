version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Guayaquil
    commit-message:
      prefix: 'deps(actions)'
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Guayaquil
    commit-message:
      prefix: 'deps(npm)'
    open-pull-requests-limit: 5
