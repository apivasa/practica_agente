name: Correo de alertas

# C-05: envía por correo (Resend) las alertas de la tabla `alerts` a cada destinatario.
# Corre después de la evaluación diaria (11:23 UTC) y la mensual (11:07 UTC del día 1), con
# una segunda pasada por si el cron de la evaluación se retrasa. Es idempotente: una alerta
# ya enviada (alerts.emailed_at) no se reenvía. Va en su propio workflow para que un fallo
# de Resend nunca afecte a la evaluación.
# 11:53 y 14:53 UTC = 06:53 y 09:53 America/Guayaquil (UTC-5 todo el año).
on:
  schedule:
    - cron: '53 11 * * *'
    - cron: '53 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: correo-alertas
  cancel-in-progress: false

jobs:
  send:
    name: enviar correos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # La clave secreta de Supabase y RESEND_API_KEY se leen del environment `produccion`.
    environment: produccion
    steps:
      # Mismo criterio que la evaluación: sin secretos de Supabase o sin EVALUATION_ENABLED
      # no hay nada que enviar. RESEND_API_KEY lo revisa el script (sin él: ::notice:: y 0).
      - name: Verificar configuración
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          EVALUATION_ENABLED: ${{ vars.EVALUATION_ENABLED }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::warning::Faltan los secretos SUPABASE_URL o SUPABASE_SECRET_KEY: se omite el envío de correos."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVALUATION_ENABLED" != "true" ]; then
            echo "::warning::La variable de repositorio EVALUATION_ENABLED no es 'true' (producción aún no publicada, V-05): se omite el envío de correos."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
      - name: Instalar dependencias de producción
        if: steps.check.outputs.ready == 'true'
        run: npm ci --ignore-scripts --omit=dev
      - name: Enviar correos
        if: steps.check.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          APP_URL: ${{ vars.PAGES_URL }}
        run: node scripts/send-alert-emails.js
