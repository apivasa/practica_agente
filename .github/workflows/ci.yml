name: CI

on:
  pull_request:
  push:
    # main + ramas de trabajo del modo autónomo (validación antes del PR).
    branches: [main, 'item/**', 'fix/**']
  # Permite lanzarlo a mano o desde lockfile.yml: los commits hechos con
  # GITHUB_TOKEN no disparan otros workflows por push/pull_request.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Acciones fijadas por SHA de commit (H-001); Dependabot propone las subidas.
# Instalación con --ignore-scripts (H-004): solo esbuild se reconstruye a mano.
jobs:
  build:
    name: build (lint, unit, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Instalar dependencias
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts; fi
          npm rebuild esbuild
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  db:
    name: db (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          # Versión fija de la CLI (H-002); se actualiza por PR revisado.
          version: 3.2.0
      - name: Levantar Postgres local
        run: supabase db start
      - name: Pruebas pgTAP
        run: supabase test db
      - name: Detener Supabase
        if: always()
        run: supabase stop --no-backup

  integration:
    name: integración (evaluate.js contra Supabase local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Instalar dependencias de producción
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts --omit=dev; else npm install --ignore-scripts --omit=dev; fi
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.2.0
      - name: Levantar Supabase local (BD + API) con la semilla
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,supavisor,postgres-meta
      - name: Evaluación mensual y diaria, dos veces cada una
        run: bash scripts/ci/integration.sh
      - name: Salud contra Supabase local y simulación de caída de Pages (V-04)
        run: bash scripts/ci/health.sh
      - name: Detener Supabase
        if: always()
        run: supabase stop --no-backup

  e2e:
    name: e2e (Playwright)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Instalar dependencias
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts; fi
          npm rebuild esbuild
      - run: npx playwright install --with-deps chromium
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          # Versión fija de la CLI (H-002); se actualiza por PR revisado.
          version: 3.2.0
      - name: Levantar Supabase local (BD con semilla, Auth y API)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - name: Exportar URL y clave publicable para el build
        # Solo la clave publicable (sb_publishable_...) llega al front; nunca la secreta.
        run: |
          supabase status -o env > "$RUNNER_TEMP/sb.env"
          get() { grep -E "^$1=" "$RUNNER_TEMP/sb.env" | head -n1 | cut -d= -f2- | tr -d '"'; }
          url="$(get API_URL)"
          key="$(get PUBLISHABLE_KEY)"
          rm -f "$RUNNER_TEMP/sb.env"
          case "$key" in
            sb_publishable_*) ;;
            *) echo "::error::supabase status no expone una clave sb_publishable_"; exit 1 ;;
          esac
          [ -n "$url" ] || { echo "::error::supabase status no expone API_URL"; exit 1; }
          echo "VITE_SUPABASE_URL=$url" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$key" >> "$GITHUB_ENV"
      - run: npm run build
      - run: npm run test:e2e
      - name: Detener Supabase
        if: always()
        run: supabase stop --no-backup
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
